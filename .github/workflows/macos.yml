name: macOS package

on:
  push:
    branches:
      - master
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  CONAN_VERSION: "2.26.1"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-15-${{ hashFiles('src/conanfile.txt') }}
          restore-keys: |
            conan-macos-15-

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
          python3 -m venv "${HOME}/.venv-conan"
          "${HOME}/.venv-conan/bin/pip" install --upgrade pip
          "${HOME}/.venv-conan/bin/pip" install "conan==${CONAN_VERSION}"
          echo "${HOME}/.venv-conan/bin" >> "${GITHUB_PATH}"

      - name: Build and package
        working-directory: src
        run: |
          conan profile detect --force
          conan install . --build=missing -s build_type=Release
          conan build external/
          ../misc/macos/build_icns.sh
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/alligator --version
          (cd build && cpack -G Bundle)
          ls -la build/alligator-*-macOS* build/*.dmg 2>/dev/null || true
          APP=""
          if [ -d build/Alligator.app ]; then
            APP=build/Alligator.app
          elif [ -d build/_CPack_Packages/Darwin/Bundle/Alligator.app ]; then
            APP=build/_CPack_Packages/Darwin/Bundle/Alligator.app
          else
            APP=$(find build/_CPack_Packages -name Alligator.app -type d | head -n 1)
          fi
          if [ -n "$APP" ]; then
            ls -la "$APP"
            ditto -c -k --keepParent "$APP" build/Alligator.app.zip
          elif ! ls build/*.dmg >/dev/null 2>&1; then
            echo "CPack produced neither Alligator.app nor a .dmg" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alligator-macos
          if-no-files-found: error
          path: |
            src/build/alligator-*-macOS*
            src/build/*.dmg
            src/build/Alligator.app.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/build/alligator-*-macOS*
            src/build/*.dmg
            src/build/Alligator.app.zip
          fail_on_unmatched_files: false

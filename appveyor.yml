# CMake/Conan project — not a Visual Studio .sln.
# Native Windows is not a supported target (Linux / FreeBSD / macOS).
# AppVeyor GitHub fetch is a zip (no .git), so do not run git/submodule commands.
version: "{build}"
image: Visual Studio 2022
clone_depth: 1
shallow_clone: true

build: off

build_script:
  - ps: |
      Write-Host "Alligator has no .sln; skip MSBuild."
      Write-Host "Packages: GitHub Actions (macOS/FreeBSD) and GitLab (Linux)."
      Write-Host "Commit $($env:APPVEYOR_REPO_COMMIT)"
      if (-not (Test-Path src\CMakeLists.txt)) { throw "missing src/CMakeLists.txt" }
      if (-not (Test-Path src\tests\mock\windows-ntfs-skip.tar)) { throw "missing windows-ntfs-skip.tar" }
